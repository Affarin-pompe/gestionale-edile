version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: compromised packages are usually pulled within days
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
    ignore:
      # The types must match the Node major in .nvmrc, not the newest Node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint sets the highest TypeScript it supports: raise both together, by hand
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
